[package]
name = "lb_web"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Browser UI for Latency Budget (wasm-bindgen + web-sys)."

[lib]
crate-type = ["cdylib", "rlib"]
test = false
doctest = false

[dependencies]
lb_core = { path = "../lb_core" }
wasm-bindgen = "0.2"
js-sys = "0.3"

[dependencies.web-sys]
version = "0.3"
features = [
  "Blob", "BlobPropertyBag", "CanvasRenderingContext2d", "CssStyleDeclaration",
  "Document", "DomRect", "DomTokenList", "Element", "Event", "EventTarget",
  "HtmlAnchorElement", "HtmlButtonElement", "HtmlCanvasElement", "HtmlElement",
  "HtmlInputElement", "KeyboardEvent", "MouseEvent", "Node", "NodeList",
  "TextMetrics", "Url", "Window",
]
